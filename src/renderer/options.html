<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self';"
    />
    <title data-i18n>Opções da Internet</title>
    <link rel="stylesheet" href="styles/options.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 3 15.5 5v4.4c0 3.4-2.2 6.2-5.5 7.6-3.3-1.4-5.5-4.2-5.5-7.6V5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield-check" viewBox="0 0 20 20"><path d="M10 3 15.5 5v4.4c0 3.4-2.2 6.2-5.5 7.6-3.3-1.4-5.5-4.2-5.5-7.6V5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m7.4 9.8 1.8 1.8 3.5-3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 20 20"><rect x="5" y="9" width="10" height="7.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 9V7a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.8 10h12.4M10 3.6c1.8 1.8 2.6 4 2.6 6.4s-.8 4.6-2.6 6.4C8.2 14.6 7.4 12.4 7.4 10s.8-4.6 2.6-6.4Z" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-rss" viewBox="0 0 20 20"><path d="M5 15.2h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4.6 10.6a5 5 0 0 1 4.8 4.8M4.6 6a9.4 9.4 0 0 1 9.4 9.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3 5.5h4.6l1.4 1.7H17v7.3H3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
      <symbol id="i-apps" viewBox="0 0 20 20"><rect x="3.2" y="3.2" width="5.4" height="5.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11.4" y="3.2" width="5.4" height="5.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3.2" y="11.4" width="5.4" height="5.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11.4" y="11.4" width="5.4" height="5.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7.5" cy="6" r="1.7" fill="#fff" stroke="currentColor" stroke-width="1.3"/><circle cx="12.5" cy="10" r="1.7" fill="#fff" stroke="currentColor" stroke-width="1.3"/><circle cx="8.5" cy="14" r="1.7" fill="#fff" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 20 20"><rect x="3" y="4.4" width="14" height="9.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 16.2h6M10 13.8v2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4.8 6h10.4M8 6V4.4h4V6M6.2 6l.7 9.6h6.2L13.8 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 20 20"><path d="M8 4.5H4.5v11h11V12M11 4.5h4.5V9M9 11l6-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12.4 12.4 3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-warning" viewBox="0 0 20 20"><path d="M10 3.6 17 16H3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="13.8" r=".9" fill="currentColor"/></symbol>
      <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="6.6" r=".9" fill="currentColor"/></symbol>
      <symbol id="i-page" viewBox="0 0 20 20"><path d="M5.5 3.5h6l3.2 3.2v9.8h-9.2Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11.3 3.7v3.3h3.2" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-network" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.8 10h12.4M10 3.6c1.8 1.8 2.6 4 2.6 6.4s-.8 4.6-2.6 6.4C8.2 14.6 7.4 12.4 7.4 10s.8-4.6 2.6-6.4Z" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-key" viewBox="0 0 20 20"><circle cx="7" cy="7" r="3.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m9.6 9.6 5.6 5.6M12.4 12.4l-1.6 1.6M14.2 14.2l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-windows" viewBox="0 0 20 20"><path d="M3 4.8 9.4 4v4.9H3ZM10.6 3.8 17 3v6H10.6ZM3 9.9h6.4V15L3 14.2ZM10.6 9.9H17v6.1l-6.4-.9Z" fill="currentColor"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.4 8.2A5.7 5.7 0 1 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.8 4.2v4.1h-4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.4 3.4 7.6-7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 20 20"><path d="M8 5.5 12.5 10 8 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3.5v8.2m0 0 3.2-3.2M10 11.7 6.8 8.5M4 14.4v1.6h12v-1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 20 20"><path d="m10 3.2 2 4.2 4.6.6-3.4 3.2.8 4.6-4-2.2-4 2.2.8-4.6L3.4 8l4.6-.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-inprivate" viewBox="0 0 20 20"><path d="M10 3.2c2.2 2.4 3.4 4.7 3.4 6.8a3.4 3.4 0 0 1-6.8 0c0-2.1 1.2-4.4 3.4-6.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.2 16.4c1.8-.8 3.8-.8 5.6 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
    </svg>

    <div class="opt-app" id="opt-app">
      <header class="opt-titlebar">
        <div class="opt-title">
          <span class="opt-logo">
            <img src="assets/icon.png" alt="" width="30" height="30" />
          </span>
          <div>
            <h1 data-i18n>Opções da Internet</h1>
            <p>IE Neo · <span id="opt-version">1.0.0</span> · FGOMESX</p>
          </div>
        </div>
        <div class="opt-window-controls">
          <button id="opt-close" class="close" title="Fechar" aria-label="Fechar" data-i18n-title data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
        </div>
      </header>

      <div class="opt-body">
        <nav class="opt-nav" aria-label="Seções das Opções da Internet" data-i18n-aria-label>
          <div class="opt-nav-label" data-i18n>Configurações</div>
          <button class="opt-nav-item" data-section="general"><svg><use href="#i-gear" /></svg><span data-i18n>Geral</span></button>
          <button class="opt-nav-item" data-section="security"><svg><use href="#i-shield-check" /></svg><span data-i18n>Segurança</span></button>
          <button class="opt-nav-item" data-section="privacy"><svg><use href="#i-lock" /></svg><span data-i18n>Privacidade</span></button>
          <button class="opt-nav-item" data-section="content"><svg><use href="#i-rss" /></svg><span data-i18n>Conteúdo</span></button>
          <button class="opt-nav-item" data-section="connections"><svg><use href="#i-network" /></svg><span data-i18n>Conexões</span></button>
          <button class="opt-nav-item" data-section="programs"><svg><use href="#i-apps" /></svg><span data-i18n>Programas</span></button>
          <button class="opt-nav-item" data-section="advanced"><svg><use href="#i-sliders" /></svg><span data-i18n>Avançado</span></button>

          <div class="opt-nav-windows">
            <div class="opt-nav-windows-head">
              <svg><use href="#i-windows" /></svg>
              <div><strong>Windows</strong><span data-i18n>Integração real</span></div>
            </div>
            <p data-i18n>Página inicial e proxy também são gravados no Registro do Windows.</p>
            <button id="opt-open-cpl"><span data-i18n>Abrir inetcpl.cpl</span> <svg><use href="#i-external" /></svg></button>
          </div>
        </nav>

        <main class="opt-main" id="opt-main">
          <div class="opt-pane-head">
            <div>
              <h2 id="opt-pane-title">Geral</h2>
              <p id="opt-pane-subtitle"></p>
            </div>
            <button class="opt-section-reset" id="opt-section-reset" title="Restaurar esta seção" data-i18n-title data-i18n>Restaurar seção</button>
          </div>
          <div class="opt-pane" id="opt-pane"></div>
        </main>
      </div>

      <footer class="opt-footer">
        <div class="opt-footer-left">
          <span class="opt-status" id="opt-status"><svg><use href="#i-shield-check" /></svg><span id="opt-status-text" data-i18n>As configurações são aplicadas ao navegador e ao Windows.</span></span>
          <button class="opt-link" id="opt-open-cpl-2" data-i18n>Painel de Controle</button>
        </div>
        <div class="opt-footer-buttons">
          <button class="opt-btn" id="opt-reset" data-i18n>Restaurar padrões</button>
          <span class="opt-footer-sep"></span>
          <button class="opt-btn" id="opt-cancel" data-i18n>Cancelar</button>
          <button class="opt-btn" id="opt-apply" data-i18n>Aplicar</button>
          <button class="opt-btn primary" id="opt-ok" data-i18n>OK</button>
        </div>
      </footer>

      <div class="opt-toast" id="opt-toast" hidden></div>
      <div class="opt-modal-root" id="opt-modal-root" hidden></div>
    </div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/i18n-en-common.js"></script>
    <script src="js/i18n-en-options.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/options-shared.js"></script>
    <script src="js/options-panes-a.js"></script>
    <script src="js/options-panes-b.js"></script>
    <script src="js/options.js"></script>
  </body>
</html>
