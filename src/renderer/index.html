<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:;"
    />
    <title>IE Neo</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-back" viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-forward" viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-reload" viewBox="0 0 20 20"><path d="M15.4 8.2A5.7 5.7 0 1 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.8 4.2v4.1h-4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-stop" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 20 20"><path d="M3.5 9.6 10 4l6.5 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.4 8.7V16h9.2V8.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.4 16v-4.2h3.2V16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 20 20"><path d="m10 3.2 2 4.2 4.6.6-3.4 3.2.8 4.6-4-2.2-4 2.2.8-4.6L3.4 8l4.6-.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-star-fill" viewBox="0 0 20 20"><path d="m10 3.2 2 4.2 4.6.6-3.4 3.2.8 4.6-4-2.2-4 2.2.8-4.6L3.4 8l4.6-.6Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-rss" viewBox="0 0 20 20"><path d="M5 15.2h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4.6 10.6a5 5 0 0 1 4.8 4.8M4.6 6a9.4 9.4 0 0 1 9.4 9.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 20 20"><path d="M10 7.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 11.2v-2.4l-1.6-.5a4.8 4.8 0 0 0-.5-1.2l.7-1.5-1.7-1.7-1.5.7a4.8 4.8 0 0 0-1.2-.5L9.7 2.5H7.3L6.8 4a4.8 4.8 0 0 0-1.2.5L4.1 3.8 2.5 5.5l.7 1.5c-.2.4-.4.8-.5 1.2l-1.5.5v2.4l1.5.5c.1.4.3.8.5 1.2l-.7 1.5 1.6 1.7 1.5-.7c.4.2.8.4 1.2.5l.5 1.5h2.4l.5-1.5c.4-.1.8-.3 1.2-.5l1.5.7 1.7-1.7-.7-1.5c.2-.4.4-.8.5-1.2l1.6-.5Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" transform="translate(1 0) scale(.9)"/></symbol>
      <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-min" viewBox="0 0 20 20"><path d="M5 10h10" stroke="currentColor" stroke-width="1.1"/></symbol>
      <symbol id="i-max" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></symbol>
      <symbol id="i-restore" viewBox="0 0 20 20"><rect x="4.5" y="7" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M7 7V4.5h8V13" fill="none" stroke="currentColor" stroke-width="1.1"/></symbol>
      <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12.4 12.4 3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 20 20"><rect x="5" y="9" width="10" height="7.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 9V7a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="12.6" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.8 10h12.4M10 3.6c1.8 1.8 2.6 4 2.6 6.4S11.8 14.6 10 16.4C8.2 14.6 7.4 12.4 7.4 10S8.2 5.4 10 3.6Z" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-warning" viewBox="0 0 20 20"><path d="M10 3.6 17 16H3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="13.8" r=".9" fill="currentColor"/></symbol>
      <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="6.6" r=".9" fill="currentColor"/></symbol>
      <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 3 15.5 5v4.4c0 3.4-2.2 6.2-5.5 7.6-3.3-1.4-5.5-4.2-5.5-7.6V5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield-check" viewBox="0 0 20 20"><path d="M10 3 15.5 5v4.4c0 3.4-2.2 6.2-5.5 7.6-3.3-1.4-5.5-4.2-5.5-7.6V5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m7.4 9.8 1.8 1.8 3.5-3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield-x" viewBox="0 0 20 20"><path d="M10 3 15.5 5v4.4c0 3.4-2.2 6.2-5.5 7.6-3.3-1.4-5.5-4.2-5.5-7.6V5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m8 8.2 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-building" viewBox="0 0 20 20"><path d="M4 16.2V4.5h8v11.7M12 8h4v8.2M2.8 16.2h14.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.3 7h1.4M9 7h1.4M6.3 9.8h1.4M9 9.8h1.4M6.3 12.6h1.4M9 12.6h1.4M14 10.8h.9M14 13.4h.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 20 20"><path d="m5.5 8 4.5 4.5L14.5 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 20 20"><path d="m5.5 12 4.5-4.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 20 20"><path d="M5 6h10M5 10h10M5 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3.5v8.2m0 0 3.2-3.2M10 11.7 6.8 8.5M4 14.4v1.6h12v-1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-history" viewBox="0 0 20 20"><path d="M10 5.2v5l3 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.3 7.2A6.4 6.4 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 4.2v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-print" viewBox="0 0 20 20"><path d="M6 7V3.8h8V7M6 13.6H4.4V7h11.2v6.6H14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><rect x="6" y="11.4" width="8" height="4.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="13.6" cy="9" r=".7" fill="currentColor"/></symbol>
      <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3 5.5h4.6l1.4 1.7H17v7.3H3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4.8 6h10.4M8 6V4.4h4V6M6.2 6l.7 9.6h6.2L13.8 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 8.4v4.8M11.4 8.4v4.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 20 20"><path d="M8 4.5H4.5v11h11V12M11 4.5h4.5V9M9 11l6-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.4 3.4 7.6-7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-compat" viewBox="0 0 20 20"><path d="M8.4 3.6 5.7 6.3M11.6 3.6l2.7 2.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4 9.5h12v5H4Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 6.7v2.2M6.4 16.2h7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-inprivate" viewBox="0 0 20 20"><path d="M10 3.2c2.2 2.4 3.4 4.7 3.4 6.8a3.4 3.4 0 0 1-6.8 0c0-2.1 1.2-4.4 3.4-6.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.2 16.4c1.8-.8 3.8-.8 5.6 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-zoom" viewBox="0 0 20 20"><circle cx="9" cy="9" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.4 12.4 16 16M9 6.9v4.2M6.9 9h4.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="8.5" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12.6 7V5.5a1 1 0 0 0-1-1H5.5a1 1 0 0 0-1 1v7.1a1 1 0 0 0 1 1H7" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-page" viewBox="0 0 20 20"><path d="M5.5 3.5h6l3.2 3.2v9.8h-9.2Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11.3 3.7v3.3h3.2" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 20 20"><path d="M12.8 3.6 16.4 7.2l-2 .7-2.9 2.9.3 2.4-1.2 1.2-2.2-2.2L5 15.4l-1.2-1.2 3.2-3.4-2.2-2.2L6 7.4l2.4.3 2.9-2.9Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-eye" viewBox="0 0 20 20"><path d="M2.8 10S5.6 5.4 10 5.4 17.2 10 17.2 10 14.4 14.6 10 14.6 2.8 10 2.8 10Z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.4 8.2A5.7 5.7 0 1 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.8 4.2v4.1h-4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <div id="app" class="app">
      <header id="titlebar" class="titlebar">
        <div class="brand no-drag" id="brand" title="IE Neo">
          <span class="brand-logo" aria-hidden="true">
            <img src="assets/icon.png" alt="" width="26" height="26" />
          </span>
          <div class="brand-text">
            <strong>IE</strong>
            <span>Neo</span>
          </div>
        </div>

        <div class="tabstrip-wrap">
          <div id="tabstrip" class="tabstrip" role="tablist" aria-label="Guias" data-i18n-aria-label></div>
          <button id="newtab-btn" class="newtab-btn no-drag" title="Nova guia (Ctrl+T)" aria-label="Nova guia" data-i18n-title data-i18n-aria-label>
            <svg><use href="#i-plus" /></svg>
          </button>
        </div>
        <div class="titlebar-drag"></div>

        <div class="window-controls no-drag">
          <button class="wc-btn" id="wc-min" title="Minimizar" aria-label="Minimizar" data-i18n-title data-i18n-aria-label><svg><use href="#i-min" /></svg></button>
          <button class="wc-btn" id="wc-max" title="Maximizar" aria-label="Maximizar" data-i18n-title data-i18n-aria-label><svg><use href="#i-max" /></svg></button>
          <button class="wc-btn wc-close" id="wc-close" title="Fechar" aria-label="Fechar" data-i18n-title data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
        </div>
      </header>

      <div class="toolbar">
        <div class="nav-group">
          <button class="nav-btn" id="btn-back" data-action="back" title="Voltar (Alt+←)" aria-label="Voltar" data-i18n-title data-i18n-aria-label><svg><use href="#i-back" /></svg></button>
          <button class="nav-btn" id="btn-forward" data-action="forward" title="Avançar (Alt+→)" aria-label="Avançar" data-i18n-title data-i18n-aria-label><svg><use href="#i-forward" /></svg></button>
          <button class="nav-btn" id="btn-reload" data-action="reload" title="Atualizar (F5)" aria-label="Atualizar" data-i18n-title data-i18n-aria-label><svg><use id="reload-icon" href="#i-reload" /></svg></button>
          <button class="nav-btn" id="btn-home" data-action="home" title="Página inicial (Alt+Home)" aria-label="Página inicial" data-i18n-title data-i18n-aria-label><svg><use href="#i-home" /></svg></button>
        </div>

        <div class="omnibox-wrap">
          <div class="omnibox" id="omnibox">
            <button class="site-badge" id="site-info-btn" title="Informações do site" aria-label="Informações do site" data-i18n-title data-i18n-aria-label>
              <svg id="site-icon"><use href="#i-globe" /></svg>
            </button>
            <input
              id="address"
              class="address"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="Barra de endereços"
              data-i18n-aria-label
              placeholder="Pesquisar ou digitar um endereço da Web"
              data-i18n-placeholder
            />
            <button class="compat-btn" id="compat-btn" title="Modo de Exibição de Compatibilidade" aria-label="Modo de Exibição de Compatibilidade" data-i18n-title data-i18n-aria-label>
              <svg><use href="#i-compat" /></svg>
            </button>
            <button class="go-btn" id="go-btn" title="Ir" aria-label="Ir para o endereço" data-i18n-title data-i18n-aria-label><svg><use href="#i-forward" /></svg></button>
          </div>
          <div id="suggestions" class="suggestions" hidden></div>
        </div>

        <div class="toolbar-actions">
          <button class="tool-btn" id="favorite-btn" title="Adicionar aos favoritos (Ctrl+D)" aria-label="Adicionar aos favoritos" data-i18n-title data-i18n-aria-label>
            <svg><use id="favorite-icon" href="#i-star" /></svg>
          </button>
          <button class="tool-btn" id="feeds-btn" title="Feeds (Alt+J)" aria-label="Feeds" data-i18n-title data-i18n-aria-label>
            <svg><use href="#i-rss" /></svg>
            <span class="feed-dot" id="feed-dot" hidden></span>
          </button>
          <button class="tool-btn" id="menu-btn" title="Ferramentas e Opções da Internet" aria-label="Ferramentas" data-i18n-title data-i18n-aria-label>
            <svg><use href="#i-gear" /></svg>
          </button>
        </div>
      </div>

      <div class="bookmarksbar" id="bookmarksbar" aria-label="Barra de Favoritos" data-i18n-aria-label>
        <div class="bookmarks-items" id="bookmarks-items"></div>
        <button class="bookmarks-more" id="bookmarks-more" title="Todos os favoritos" aria-label="Todos os favoritos" data-i18n-title data-i18n-aria-label>
          <svg><use href="#i-chevron-down" /></svg>
        </button>
      </div>

      <div id="infobar" class="infobar" hidden role="status">
        <svg class="infobar-icon"><use id="infobar-icon" href="#i-info" /></svg>
        <span id="infobar-text" class="infobar-text"></span>
        <div id="infobar-actions" class="infobar-actions"></div>
        <button class="infobar-close" id="infobar-close" title="Fechar" aria-label="Fechar aviso" data-i18n-title data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
      </div>

      <main class="content" id="content">
        <div id="views" class="views"></div>

        <section id="hub" class="hub" hidden aria-label="Central de navegação" data-i18n-aria-label>
          <header class="hub-header">
            <div class="hub-title">
              <div id="hub-icon" class="hub-icon"><svg><use href="#i-history" /></svg></div>
              <div>
                <h2 id="hub-heading" data-i18n>Histórico</h2>
                <p id="hub-subtitle" data-i18n>Revise, pesquise e gerencie sua navegação.</p>
              </div>
            </div>
            <div class="hub-header-actions">
              <div class="hub-search">
                <svg><use href="#i-search" /></svg>
                <input id="hub-search" type="search" placeholder="Pesquisar no histórico" data-i18n-placeholder spellcheck="false" />
              </div>
              <button class="hub-action" id="hub-primary" data-i18n>Limpar tudo</button>
              <button class="hub-close" id="hub-close" title="Fechar" aria-label="Fechar" data-i18n-title data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
            </div>
          </header>
          <div id="hub-body" class="hub-body"></div>
        </section>

        <aside id="feeds-panel" class="feeds-panel" hidden aria-label="Feeds" data-i18n-aria-label>
          <header class="feeds-header">
            <div>
              <h2 data-i18n>Feeds</h2>
              <p id="feeds-source" data-i18n>Nenhum feed detectado nesta página</p>
            </div>
            <button class="hub-close" id="feeds-close" aria-label="Fechar feeds" data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
          </header>
          <div id="feeds-body" class="feeds-body"></div>
        </aside>

        <div id="findbar" class="findbar" hidden>
          <svg class="find-icon"><use href="#i-search" /></svg>
          <input id="find-input" type="text" placeholder="Localizar na página" data-i18n-placeholder spellcheck="false" aria-label="Localizar na página" data-i18n-aria-label />
          <span id="find-count" class="find-count" data-i18n>0 de 0</span>
          <button class="find-btn" id="find-prev" title="Ocorrência anterior (Shift+Enter)" aria-label="Anterior" data-i18n-title data-i18n-aria-label><svg><use href="#i-chevron-up" /></svg></button>
          <button class="find-btn" id="find-next" title="Próxima ocorrência (Enter)" aria-label="Próxima" data-i18n-title data-i18n-aria-label><svg><use href="#i-chevron-down" /></svg></button>
          <button class="find-btn" id="find-close" title="Fechar (Esc)" aria-label="Fechar" data-i18n-title data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
        </div>

        <div id="downloads-shelf" class="downloads-shelf" hidden>
          <header class="shelf-header">
            <svg><use href="#i-download" /></svg>
            <div>
              <strong id="shelf-title">Download</strong>
              <span id="shelf-subtitle" data-i18n>Preparando…</span>
            </div>
            <button class="shelf-close" id="shelf-close" aria-label="Fechar" data-i18n-aria-label><svg><use href="#i-close" /></svg></button>
          </header>
          <div class="shelf-progress"><div id="shelf-progress-bar"></div></div>
          <div class="shelf-actions">
            <button id="shelf-open" class="shelf-link" data-i18n>Abrir</button>
            <button id="shelf-show" class="shelf-link" data-i18n>Mostrar na pasta</button>
            <button id="shelf-more" class="shelf-link" data-i18n>Ver downloads</button>
          </div>
        </div>

        <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
      </main>

      <footer class="statusbar" id="statusbar">
        <div class="status-left">
          <span id="status-link" class="status-link"></span>
        </div>
        <div class="status-right">
          <button id="status-progress" class="status-item status-progress" hidden><span class="spinner"></span> <span data-i18n>Carregando…</span></button>
          <button id="status-zoom" class="status-item status-clickable" title="Nível de zoom" data-i18n-title>100%</button>
          <button id="status-protected" class="status-item status-clickable" title="Modo Protegido" data-i18n-title>
            <svg><use href="#i-shield-check" /></svg>
            <span data-i18n>Modo Protegido: Ativado</span>
          </button>
          <button id="status-zone" class="status-item status-zone status-clickable" title="Zona de segurança" data-i18n-title>
            <svg><use href="#i-globe" /></svg>
            <span id="status-zone-label">Internet</span>
          </button>
        </div>
      </footer>

      <div id="menu-popover" class="popover menu-popover" hidden></div>
      <div id="zoom-popover" class="popover zoom-popover" hidden></div>
      <div id="site-popover" class="popover site-popover" hidden></div>
      <div id="modal-root" class="modal-root" hidden></div>
    </div>
